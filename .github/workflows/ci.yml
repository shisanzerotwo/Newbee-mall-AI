name: CI

# 为什么这样写（本案的特殊约束，改之前先读）：
#  1. 本项目**需要** MySQL 与带 Query Engine 的 Redis（向量检索用 FT.* 命令）。
#     所以用 services 起 mysql:9.7 + redis:8，而不是 mock 掉。
#  2. 知识库构建（KnowledgeBuilder）是**异步**的，且首次会加载 ONNX 嵌入模型
#     （现在默认是 bge-small-zh-v15，需下载模型文件）→ 因此给测试较宽松的超时。
#  3. 不跑真实模型调用：CI 里**没有** agnes key，
#     所以只跑单测 + 需要 DB/Redis 的集成测试（这些不依赖上游模型）。
#     真实模型端到端（CsAgentRealCallIT）**必须**手动跑，不在 CI 里 ——
#     否则会因上游限流把 CI 变成随机红灯。

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: newbee_mall_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      redis:
        # 必须是 redis:8 —— 本项目用 FT.CREATE ... VECTOR（Query Engine），
        # 老版本/普通 redis 镜像没有这些命令
        image: redis:8
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for MySQL and import schema
        run: |
          set -e
          # 等 MySQL 真正可用（healthcheck 有时先于初始化完成）
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pci-root-pw --silent 2>/dev/null; then
              echo "MySQL ready after ${i} tries"; break
            fi
            sleep 5
          done
          # 导入初始化数据（ops/init.sql 含建表 + 商品数据 + cs_chat_memory）
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-root-pw < ops/init.sql

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: newbee_mall_db
          DB_PASSWORD: ci-root-pw
          # RAG 必须指向带 Query Engine 的 redis:8
          CS_RAG_REDIS_PORT: '16379'
        run: |
          cd mall-backend
          mvn -B -q test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: mall-backend/target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # XSS 行为验证（P3）：把 CsXssBrowserIT 接进 CI。
  #
  # 为什么拆成**独立 job**而不是塞进上面那个：
  #   1. 它**不需要 MySQL / Redis** —— 夹具是进程内 HttpServer + 仓库里真实的前端 JS/模板，
  #      本机实测（不导出 .env）3 个用例 8.7s 通过，所以这里**不配 services**，启动最快；
  #   2. 它需要**真实浏览器**，而上面那个 job 的 JDK/服务组合与它无关，
  #      混在一起会让"跑不了 Chrome"污染主构建的结论。
  #
  # Chrome 从哪来：ubuntu-latest 镜像**自带** Google Chrome（`/usr/bin/google-chrome`）。
  #   ⚠️ 这条**未在本机复现**（本机跑不了 GitHub Actions，Linux 侧 Chrome 行为也没验过）——
  #   依据是 runner-images 仓库 ubuntu 镜像的公开软件清单（含 Chrome 及其版本更新 issue）。
  #   因此本 job 的设计对"没有 Chrome"是**安全**的：IT 按既有约定 skip 而非 fail
  #   （不制造随机红灯），由末尾那步用 ::warning:: 把"本次 CI 其实没验证 XSS"喊出来，
  #   避免静默空跑 —— 第一次在 CI 上跑的结果请当作这条事实的**实证**。
  # ---------------------------------------------------------------------------
  xss-browser-it:
    name: XSS 行为验证（真实 Chrome）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 浏览器可用性（仅告知，不阻断）
        run: google-chrome --version || echo "未找到 google-chrome —— CsXssBrowserIT 会跳过"

      - name: Run CsXssBrowserIT
        run: |
          cd mall-backend
          mvn -B test -Dtest=CsXssBrowserIT

      - name: 本次 CI 是否真的验证了 XSS（被跳过就喊出来）
        if: always()
        run: |
          report=mall-backend/target/surefire-reports/ltd.newbee.mall.controller.mall.CsXssBrowserIT.txt
          if [ -f "$report" ] && grep -q "Skipped: 0" "$report"; then
            echo "✅ CsXssBrowserIT 真实执行（Chrome 可用）：$(grep 'Tests run' "$report")"
          else
            echo "::warning::CsXssBrowserIT 被跳过 —— 本次 CI 并没有验证 XSS（无 Chrome 时按约定 skip 而非 fail，这里是提醒而不是失败）"
          fi

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xss-it-surefire-reports
          path: mall-backend/target/surefire-reports/
          if-no-files-found: ignore
