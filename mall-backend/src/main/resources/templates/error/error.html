<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>系统异常</title>
    <style>
        :root {
            --bg: #fafafa; --bg-1: #ffffff; --bg-2: #f4f4f5; --bg-3: #ededef;
            --bd: #e4e4e7; --bd-2: #d4d4d8;
            --t1: #18181b; --t2: #52525b; --t3: #6b6b75;
            --ink: #18181b; --ink-hi: #2f2f36; --ink-fg: #ffffff;
            --bad: #dc2626;
            --r-md: 8px; --r-sm: 6px; --ease: cubic-bezier(.4,0,.2,1);
        }
        html[data-theme="dark"] {
            --bg: #0a0a0b; --bg-1: #121214; --bg-2: #1a1a1c; --bg-3: #232326;
            --bd: #26262a; --bd-2: #38383d;
            --t1: #fafafa; --t2: #a1a1aa; --t3: #84848e;
            --ink: #ffffff; --ink-hi: #e4e4e7; --ink-fg: #0a0a0b;
            --bad: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            color: var(--t1);
            padding: 40px 16px;
        }
        .wrap { max-width: 860px; margin: 0 auto; }
        .code {
            font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--t1);
            border-left: 3px solid var(--bd-2);
            padding-left: 16px;
        }
        h1 { font-size: 22px; font-weight: 600; margin: 16px 0 20px; }
        h2 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; color: var(--t2); }
        .card {
            background: var(--bg-1);
            border: 1px solid var(--bd);
            border-radius: var(--r-md);
            padding: 18px 20px;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .err-message { color: var(--bad); font-weight: 600; }
        .meta { font-size: 14px; color: var(--t2); line-height: 1.8; }
        .stack {
            font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
            font-size: 12px;
            color: var(--t2);
            line-height: 1.7;
            max-height: 320px;
            overflow: auto;
        }
        .brand { color: var(--ink); text-decoration: none; }
        .brand:hover { text-decoration: underline; }
        .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            height: 44px;
            background: var(--ink);
            color: var(--ink-fg);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--r-sm);
            text-decoration: none;
            transition: background-color 120ms var(--ease);
        }
        .btn:hover { background: var(--ink-hi); color: var(--ink-fg); }
        .btn--ghost { background: transparent; border: 1px solid var(--bd-2); color: var(--t1); }
        .btn--ghost:hover { background: var(--bg-2); border-color: var(--bd-2); color: var(--t1); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="code">500</div>
    <h1>系统开小差了</h1>
    <div class="btns">
        <a class="btn" href="/">返回首页</a>
        <a class="btn btn--ghost" href="/cs">问客服</a>
    </div>
    <div class="card">
        <p class="err-message" th:text="'错误信息：'+${message}"></p>
        <p class="meta" th:text="'请求地址：'+${url}"></p>
    </div>
    <h2>报告问题</h2>
    <div class="card meta">
        <a class="brand" href="https://github.com/newbee-ltd/newbee-mall/issues/new" target="_blank">提交 issue</a>
    </div>
    <h2>异常堆栈跟踪日志</h2>
    <div class="card stack" th:each="string:${stackTrace}">
        <div th:text="${string}"></div>
    </div>
    <h2>Copyright</h2>
    <div class="card meta">
        <p th:text="'author：'+${author}"></p>
        <p th:text="'ltd：'+${ltd}"></p>
    </div>
</div>
</body>
</html>
