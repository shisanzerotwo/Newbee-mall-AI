<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>系统异常</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #f6f8f9;
            font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            color: #1f2328;
            padding: 40px 16px;
        }
        .wrap { max-width: 860px; margin: 0 auto; }
        .code {
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
            color: #1baeae;
        }
        h1 { font-size: 22px; margin: 16px 0 20px; }
        h2 { font-size: 16px; margin: 24px 0 10px; }
        .card {
            background: #fff;
            border: 1px solid #e4e8eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .err-message { color: #d1242f; font-weight: 600; }
        .meta { font-size: 14px; color: #57606a; line-height: 1.8; }
        .stack {
            font-family: Consolas, Menlo, monospace;
            font-size: 12px;
            color: #57606a;
            line-height: 1.7;
            max-height: 320px;
            overflow: auto;
        }
        .brand { color: #0d7f7f; text-decoration: none; }
        .btn {
            display: inline-block;
            padding: 0 24px;
            height: 40px;
            line-height: 40px;
            background: #0d7f7f;
            color: #fff;
            font-size: 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 150ms ease-out;
        }
        .btn:hover { background: #0a6060; color: #fff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="code">500</div>
    <h1>系统开小差了</h1>
    <div class="card">
        <p class="err-message" th:text="'错误信息：'+${message}"></p>
        <p class="meta" th:text="'请求地址：'+${url}"></p>
    </div>
    <a class="btn" href="/">返回首页</a>
    <h2>报告问题</h2>
    <div class="card meta">
        <a class="brand" href="https://github.com/newbee-ltd/newbee-mall/issues/new" target="_blank">提交 issue</a>
    </div>
    <h2>异常堆栈跟踪日志</h2>
    <div class="card stack" th:each="string:${stackTrace}">
        <div th:text="${string}"></div>
    </div>
    <h2>Copyright</h2>
    <div class="card meta">
        <p th:text="'author：'+${author}"></p>
        <p th:text="'ltd：'+${ltd}"></p>
    </div>
</div>
</body>
</html>
