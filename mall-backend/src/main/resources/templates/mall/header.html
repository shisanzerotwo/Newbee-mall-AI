<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head-fragment(title,path)">
    <meta charset="UTF-8">
    <title>新蜂商城 NewBee商城 newbee-mall</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      /* 提前应用主题偏好，避免首帧闪白。
         v4 收敛为 浅/深 两套：light（默认）/ dark。
         兼容旧 key：nb-theme 里残留的 t0~t5 一律映射（t3→light，其余→dark）。 */
      (function(){
        try{
          var m=location.search.match(/[?&]theme=(dark|light|t[0-5])/);
          var raw=m?m[1]:localStorage.getItem("nb-theme");
          var t="light";
          if(raw==="dark"||(raw&&raw!=="light"&&raw!=="t3")){t="dark";}
          else if(raw==="light"||raw==="t3"){t="light";}
          document.documentElement.setAttribute("data-theme",t);
        }catch(e){}
      })();
    </script>
    <link rel="stylesheet" th:href="@{/mall/css/swiper-bundle.min.css}">
    <link rel="stylesheet" th:href="@{/mall/css/iconfont.css}">
    <link rel="stylesheet" th:href="@{/mall/css/onyx.css}">
    <link rel="stylesheet" th:href="@{/mall/css/common.css}">
    <link rel="stylesheet" th:href="@{/mall/css/themes.css}">
    <link rel="stylesheet" th:href="@{/mall/styles/header.css}">
    <link rel="stylesheet" th:href="@{'/mall/styles/'+${path}+'.css'}">
    <link rel="stylesheet" th:href="@{/admin/plugins/sweetalert2/sweetalert2.min.css}"/>
    <meta name="keywords" content="新蜂商城,newbee-mall,新蜂,商城,开源商城,newbee,企业级商城,大型商城项目,Java商城,springboot商城,SpringBoot商城项目,Spring Boot 大型线上商城项目实战教程" />
    <meta name="description" content="newbee-mall 项目（新蜂商城）是一套电商系统，包括 newbee-mall 商城系统及 newbee-mall-admin 商城后台管理系统，基于 Spring Boot 2.X 及相关技术栈开发。前台商城系统包含首页门户、商品分类、新品上线、首页轮播、商品推荐、商品搜索、商品展示、购物车、订单结算、订单流程、个人订单管理、会员中心、帮助中心等模块。后台管理系统包含数据面板、轮播图管理、商品管理、订单管理、会员管理、分类管理、设置等模块。Spring Boot 大型线上商城项目实战教程"/>
</head>
<!-- 单一 sticky 头部：logo + 搜索 + 用户/购物车（v2 排版：简洁丝滑） -->
<header id="sitehead" th:fragment="header-fragment">
    <div class="head-inner">
        <a th:href="@{/index}" class="logo">新蜂商城<small>NEWBEE MALL</small></a>
        <div class="search-box">
            <div class="search">
                <input class="text" type="text" id="keyword" autocomplete="off" placeholder="搜索商品关键词">
                <div class="search_hot"></div>
            </div>
            <div class="button iconfont icon-search1" onclick="search()"></div>
        </div>
        <nav class="head-links">
            <a class="admin-link" th:href="@{/admin}">后台管理</a>
            <div class="theme-entry">
                <button class="theme-btn" id="themeBtn">主题 ▾</button>
                <div class="theme-menu" id="themeMenu"></div>
            </div>
            <th:block th:unless="${session.newBeeMallUser==null}">
                <div class="user">
                    <ul class="selector">
                        <li><a th:href="@{/personal}">个人中心</a></li>
                        <li><a th:href="@{/orders}">我的订单</a></li>
                        <li><a th:href="@{/logout}">退出登录</a></li>
                    </ul>
                    <a href="##" class="username">
                        <th:block th:text="${session.newBeeMallUser.nickName}"></th:block>
                        <i class="iconfont icon-down"></i>
                    </a>
                </div>
                <div class="shopcart">
                    <a th:href="@{/shop-cart}"><i class="iconfont icon-cart"></i>
                        购物车(
                        <th:block th:text="${session.newBeeMallUser.shopCartItemCount}"></th:block>
                        )</a>
                </div>
            </th:block>
            <th:block th:if="${session.newBeeMallUser==null}">
                <ul class="login">
                    <li><a th:href="@{/login}">登录</a></li>
                    <li><a th:href="@{/register}">注册</a></li>
                </ul>
                <div class="shopcart">
                    <a th:href="@{/shop-cart}"><i class="iconfont icon-cart"></i>
                        购物车(0)</a>
                </div>
            </th:block>
        </nav>
    </div>
</header>
<!-- 主题切换（深/浅 2 套）+ 头部投影 -->
<script>
(function(){
  var THEMES=[
    {id:"light",name:"浅色",c:"#FFFFFF"},
    {id:"dark",name:"深色",c:"#18181B"}
  ];
  var menu=document.getElementById("themeMenu"),btn=document.getElementById("themeBtn");
  if(menu&&btn){
    menu.innerHTML=THEMES.map(function(t){
      return '<button data-t="'+t.id+'"><span class="dotc" style="background:'+t.c+'"></span>'+t.name+'</button>';
    }).join("");
    function sync(t){menu.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)})}
    var cur="light";try{var s=localStorage.getItem("nb-theme");if(s==="dark"||(s&&s!=="light"&&s!=="t3"))cur="dark"}catch(e){}
    function apply(t){
      document.documentElement.setAttribute("data-theme",t);
      try{localStorage.setItem("nb-theme",t)}catch(err){}
      sync(t);
    }
    sync(cur);
    btn.onclick=function(e){e.stopPropagation();menu.classList.toggle("open")};
    document.addEventListener("click",function(){menu.classList.remove("open")});
    menu.onclick=function(e){
      var b=e.target.closest("button");if(!b)return;
      apply(b.dataset.t);
    };
  }
  /* sticky 头部滚动投影 */
  var head=document.getElementById("sitehead");
  if(head) addEventListener("scroll",function(){head.classList.toggle("scrolled",scrollY>8)},{passive:true});
})();
</script>
<!-- v2：nav-fragment 已并入单一头部，保留空桩维持旧模板兼容 -->
<nav th:fragment="nav-fragment"></nav>
</html>
