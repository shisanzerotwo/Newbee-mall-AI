server.port=28089
spring.thymeleaf.cache=false
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# host/port/db 均可被环境变量覆盖：本机默认 localhost，容器内经 DB_HOST=mysql 指向服务名
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:newbee_mall_db}?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# 日志落盘（便于升级/排障后独立复查；“零异常”结论不该只存在于终端）
logging.file.name=logs/newbee-mall.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
# 静态资源开发期缓存策略:强制回源验证(未变更返回304),避免改图后浏览器仍显示旧图
spring.web.resources.cache.cachecontrol.no-cache=true
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
# redis config（Boot 3 前缀：spring.data.redis.*）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# ===== AI 客服（M2）=====
# 模型通道：**开写编排层（M2-4）之前**必须先通过 function calling spike
# （见 docs/DESIGN.md §2#21 / §9.3 与风险 R1）。
# 口径说明：M2-1~M2-3（装配、工具层、RAG）都不需要模型连通，本项不构成它们的前置门槛。
# 候选：OmniRoute 网关（http://localhost:20128/v1）/ Agnes AI Hub 直连
# 密钥不入库：用 CS_MODEL_API_KEY 环境变量注入（WSL 下需经 ops/mvn.sh 的 WSLENV 转发）
cs.model.base-url=${CS_MODEL_BASE_URL:http://localhost:20128/v1}
cs.model.api-key=${CS_MODEL_API_KEY:not-configured}
cs.model.name=${CS_MODEL_NAME:auto}
cs.model.temperature=0.2
cs.model.timeout-seconds=60

# ===== AI 客服 · RAG（M2-3）=====
# 向量库用官方 redis:8（带 Query Engine / FT.* 命令），经 docker-compose 映射到宿主 16379
# （本机 6379 上跑的是 Redis 3.0.504，无向量能力，勿用）
cs.rag.enabled=${CS_RAG_ENABLED:true}
cs.rag.redis-host=${CS_RAG_REDIS_HOST:localhost}
cs.rag.redis-port=${CS_RAG_REDIS_PORT:16379}
cs.rag.index-name=goods_kb
cs.rag.top-k=3
# 分块参数对齐 Python 版 kb.py（size=400 / overlap=80）
cs.rag.chunk-size=400
cs.rag.chunk-overlap=80
