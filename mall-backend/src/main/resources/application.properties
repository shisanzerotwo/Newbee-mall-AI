server.port=28089
spring.thymeleaf.cache=false

# ===== 虚拟线程（M3）=====
# Spring Boot 3.2+ 官方支持：开启后 Tomcat 的请求处理与 @Async 任务都跑在虚拟线程上。
# 动机（本项目的真实场景）：客服链路是**IO 密集**的 —— 一次问答要等模型 API 数十秒、
#   还要等 DB/Redis。平台线程（默认 200 个）在这种场景下会被大量占用而闲置等待；
#   虚拟线程可以在同样内存下支撑高得多的并发等待。
# 注意：启动日志会打印 "Enabled virtual threads"，压测时应当核对（别只看配置项在不在）。
spring.threads.virtual.enabled=true
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# host/port/db 均可被环境变量覆盖：本机默认 localhost，容器内经 DB_HOST=mysql 指向服务名
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:newbee_mall_db}?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# 日志落盘（便于升级/排障后独立复查；“零异常”结论不该只存在于终端）
logging.file.name=logs/newbee-mall.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
# 静态资源开发期缓存策略:强制回源验证(未变更返回304),避免改图后浏览器仍显示旧图
spring.web.resources.cache.cachecontrol.no-cache=true
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
# redis config（Boot 3 前缀：spring.data.redis.*）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# ===== AI 客服（M2）=====
# 模型通道：**开写编排层（M2-4）之前**必须先通过 function calling spike
# （见 docs/DESIGN.md §2#21 / §9.3 与风险 R1）。
# 口径说明：M2-1~M2-3（装配、工具层、RAG）都不需要模型连通，本项不构成它们的前置门槛。
# 候选：OmniRoute 网关（http://localhost:20128/v1）/ Agnes AI Hub 直连
# 密钥不入库：用 CS_MODEL_API_KEY 环境变量注入（WSL 下需经 ops/mvn.sh 的 WSLENV 转发）
cs.model.base-url=${CS_MODEL_BASE_URL:http://localhost:20128/v1}
cs.model.api-key=${CS_MODEL_API_KEY:not-configured}
cs.model.name=${CS_MODEL_NAME:auto}
cs.model.temperature=0.2
# 单次模型调用的超时（LangChain4j 会同时用于连接超时与读超时；读超时按「每次读取」重置，
#   所以长流式回答不会被它误杀，只有真的卡住不动才会中断）
# M2-5 从 60s 收紧到 15s：claude 终审实测「免费额度受限时单次 answer() 24~80s」，
#   与 DESIGN §2#14 承诺的「完整回答 <8s」差一个数量级；收紧后失败更快暴露（详见 §12 风险册 R12）。
cs.model.timeout-seconds=${CS_MODEL_TIMEOUT_SECONDS:15}

# ===== AI 客服 · RAG（M2-3）=====
# 向量库用官方 redis:8（带 Query Engine / FT.* 命令），经 docker-compose 映射到宿主 16379
# （本机 6379 上跑的是 Redis 3.0.504，无向量能力，勿用）
cs.rag.enabled=${CS_RAG_ENABLED:true}
cs.rag.redis-host=${CS_RAG_REDIS_HOST:localhost}
cs.rag.redis-port=${CS_RAG_REDIS_PORT:16379}
cs.rag.index-name=goods_kb
cs.rag.top-k=3
# 分块参数对齐 Python 版 kb.py（size=400 / overlap=80）
cs.rag.chunk-size=400
cs.rag.chunk-overlap=80

# ===== AI 客服 · 编排与质检（M2-4）=====
# 质检模式：
#   audit（默认）—— 旁路：回答先生成返回，质检事后异步跑，不阻塞、不打回（结论经 future 回给调用方）
#   gate          —— 同步把关：不合格时把质检意见追加给客服，重答一次（只一次，不循环）
cs.qa.mode=${CS_QA_MODE:audit}
# 工具循环轮次上限：防止模型反复调工具无限循环（Python 教学版没有这个上限，本项目必须加）
cs.agent.max-tool-rounds=${CS_MAX_TOOL_ROUNDS:5}
# 注入客服上下文的 RAG 片段数
cs.agent.top-k=${CS_AGENT_TOP_K:3}
# 模型调用重试次数（应用层自实现，见 CsAgentService.chat / CsStreamService.streamRoundWithRetry）
# 注：LangChain4j 的 Builder *有* maxRetries（默认 2），已在 CsAgentConfig 里设为 0 关闭，
#     避免内置指数退避与这里的线性退避叠加（最坏 3x3=9 个请求）。
#     本节配置只管应用层重试：1 次初始 + n 次重试。
# 背景：OmniRoute → agnes 免费额度会高频 429（响应明写 "reset after 3s"），
#     且每次尝试都会刷新该窗口 → 退避必须 >3s（现用 4000ms × 第几次 = 4s / 8s）。
# ⚠️ M2-5 从 3 收到 2：配合 15s 单次超时，最坏预算 ≈ 15+4+15 = 34s；
#     若保留 3 次则最坏 ≈ 15+4+15+8+15 = 57s，会吃掉 SSE 120s 上限的一半。
cs.agent.max-model-retries=${CS_MAX_MODEL_RETRIES:2}

# ===== AI 客服 · SSE 流式（M2-5）=====
# 单连接上限：到点由容器自动收尾（DESIGN 决策 #40 与 DoD「SSE 连接 120s 自动收尾」）
cs.stream.emitter-timeout-ms=${CS_SSE_EMITTER_TIMEOUT_MS:120000}
# 质检兜底超时：audit 模式下 done 已发出后，等异步质检结论的上限；
#   超时则发 review{qualified:null,reason:"质检超时"} 再结束（DESIGN §4.2 指定）
cs.stream.review-timeout-ms=${CS_REVIEW_TIMEOUT_MS:3000}
# 单轮流式调用上限：模型既不吐数据也不报错时，不能让线程永久挂住
# 取值 45s（而非 60s）：工具循环最多 2 轮，2×45s + 退避(4s+8s) ≈ 102s，
#   卡在 cs.stream.emitter-timeout-ms(120s) 以内；若用 60s，最坏 2×60+12 = 132s
#   会先撞上 emitter 上限 —— 那时客户端看到的是连接被强制关闭，而不是我们自己的兜底话术。
cs.stream.round-timeout-ms=${CS_ROUND_TIMEOUT_MS:45000}

# ===== AI 客服 · 会话记忆（M2-5）=====
# 会话维度：登录用 userId；匿名用前端 localStorage 的 conversationId
# ⚠️ 绝不用 sessionId：未启用 Spring Session，session 重启即变，跨重启记忆永远不可能满足（DESIGN §7.4）
cs.memory.enabled=${CS_MEMORY_ENABLED:true}
# 单会话注入上限（20 条 = 10 轮对话，DESIGN §7.4）
cs.memory.max-injected-messages=${CS_MEMORY_MAX_MESSAGES:20}
# 超过该天数的会话由每日 03:30 的定时任务归档删除（DESIGN §7.4）
cs.memory.retention-days=${CS_MEMORY_RETENTION_DAYS:30}
