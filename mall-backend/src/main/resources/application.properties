server.port=28089
spring.thymeleaf.cache=false
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/newbee_mall_db?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=REDACTED_PASSWORD
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# 静态资源开发期缓存策略:强制回源验证(未变更返回304),避免改图后浏览器仍显示旧图
spring.web.resources.cache.cachecontrol.no-cache=true
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
# redis config
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
# ===== Agent 客服只读接口配置（Phase 2）=====
# X-Agent-Key 请求头校验密钥；留空 = 关闭校验（仅限本机学习）
agent.api-key=REDACTED_KEY
